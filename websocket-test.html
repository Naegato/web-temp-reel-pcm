<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat Test</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <h1>Test de Connexion WebSocket</h1>
    
    <div id="status">Déconnecté</div>
    <div id="log"></div>
    
    <br>
    <input type="text" id="tokenInput" placeholder="JWT Token" style="width: 400px;">
    <button onclick="connectWebSocket()">Se connecter</button>
    <button onclick="disconnectWebSocket()">Se déconnecter</button>
    
    <br><br>
    <input type="text" id="messageInput" placeholder="Message de test">
    <button onclick="testMessage()">Envoyer test</button>

    <script>
        let socket;
        const log = document.getElementById('log');
        const status = document.getElementById('status');

        function logMessage(msg) {
            const div = document.createElement('div');
            div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            log.appendChild(div);
            console.log(msg);
        }

        function connectWebSocket() {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) {
                alert('Veuillez entrer un token JWT valide');
                return;
            }

            // Déconnecter si déjà connecté
            if (socket) {
                socket.disconnect();
            }

            logMessage('Tentative de connexion WebSocket...');
            
            // Se connecter avec le token
            socket = io('http://localhost:4000/chat', {
                auth: {
                    token: token // Token dans auth (corrigé)
                },
                extraHeaders: {
                    'Authorization': `Bearer ${token}` // Token dans headers (fallback)
                },
                transports: ['websocket', 'polling'],
                timeout: 5000
            });

            // Events de connexion
            socket.on('connect', () => {
                status.textContent = 'Connecté ✅';
                status.style.color = 'green';
                logMessage('✅ WebSocket connecté! Socket ID: ' + socket.id);
            });

            socket.on('disconnect', (reason) => {
                status.textContent = 'Déconnecté ❌';
                status.style.color = 'red';
                logMessage('❌ WebSocket déconnecté: ' + reason);
            });

            socket.on('connect_error', (error) => {
                status.textContent = 'Erreur de connexion ❌';
                status.style.color = 'red';
                logMessage('❌ Erreur de connexion: ' + error.message);
            });

            // Events du chat
            socket.on('connected', (data) => {
                logMessage('🔌 Connexion confirmée: ' + JSON.stringify(data));
            });

            socket.on('error', (error) => {
                logMessage('🚨 Erreur serveur: ' + JSON.stringify(error));
            });

            socket.on('new_message', (data) => {
                logMessage('💬 Nouveau message: ' + JSON.stringify(data));
            });

            socket.on('new_chat_waiting', (data) => {
                logMessage('🆕 Nouveau chat en attente: ' + JSON.stringify(data));
            });

            socket.on('chat_assigned', (data) => {
                logMessage('👤 Chat assigné: ' + JSON.stringify(data));
            });

            socket.on('advisor_assigned', (data) => {
                logMessage('👨‍💼 Advisor assigné: ' + JSON.stringify(data));
            });
        }

        function disconnectWebSocket() {
            if (socket) {
                socket.disconnect();
                socket = null;
                status.textContent = 'Déconnecté';
                status.style.color = 'gray';
                logMessage('🔌 Déconnexion manuelle');
            }
        }

        function testMessage() {
            const message = document.getElementById('messageInput').value.trim();
            if (!socket || !socket.connected) {
                alert('WebSocket non connecté');
                return;
            }
            if (!message) {
                alert('Veuillez entrer un message');
                return;
            }

            logMessage('📤 Envoi de test: ' + message);
            socket.emit('test_message', { content: message });
        }

        // Instructions pour récupérer le token
        logMessage('📋 Instructions:');
        logMessage('1. Connectez-vous à votre application web');
        logMessage('2. Ouvrez les outils de développement (F12)');
        logMessage('3. Allez dans Application > Cookies');
        logMessage('4. Copiez la valeur du cookie "auth_token"');
        logMessage('5. Collez-la dans le champ ci-dessus et cliquez "Se connecter"');
    </script>
</body>
</html>
